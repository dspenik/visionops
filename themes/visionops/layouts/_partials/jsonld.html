{{- $orgID := printf "%s#organization" site.Home.Permalink }}
{{- if .IsHome }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": {{ printf "%s#website" site.Home.Permalink }},
    "name": {{ site.Title }},
    "url": {{ site.Home.Permalink }},
    "inLanguage": "cs",
    "publisher": { "@id": {{ $orgID }} }
}
</script>
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": {{ $orgID }},
    "name": {{ site.Title }},
    "description": {{ site.Params.description }},
    "url": {{ site.Home.Permalink }},
    "logo": {{ "images/og-image.png" | absURL }},
    "image": {{ "images/og-image.png" | absURL }},
    "email": {{ site.Params.email }},
    "areaServed": { "@type": "Country", "name": "Czech Republic" },
        "knowsAbout": ["Kubernetes", "OpenShift", "Proxmox", "ArgoCD", "Prometheus", "Grafana", "OpenTelemetry", "Terraform", "Ansible", "GitLab CI"],
    "contactPoint": {
        "@type": "ContactPoint",
        "email": {{ site.Params.email }},
        "contactType": "sales",
        "availableLanguage": ["Czech", "English"]
    }
    {{- with site.Params.sameAs }},
    "sameAs": {{ . }}
    {{- end }}
}
</script>
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
        {{- range $i, $f := hugo.Data.faq }}{{ if $i }},{{ end }}
        {
            "@type": "Question",
            "name": {{ $f.question }},
            "acceptedAnswer": { "@type": "Answer", "text": {{ $f.answer }} }
        }
        {{- end }}
    ]
}
</script>
{{- else if ne .Kind "404" }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {{- $crumbs := .Ancestors.Reverse | append . }}
        {{- range $i, $p := $crumbs }}{{ if $i }},{{ end }}
        {
            "@type": "ListItem",
            "position": {{ add $i 1 }},
            "name": {{ cond $p.IsHome site.Title ($p.Params.breadcrumb | default $p.LinkTitle) }},
            "item": {{ $p.Permalink }}
        }
        {{- end }}
    ]
}
</script>
{{- if and .IsPage (eq .Section "blog") }}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ .Title }},
    "description": {{ .Description }},
    "url": {{ .Permalink }},
    "mainEntityOfPage": {{ .Permalink }},
    "datePublished": {{ .Date.Format "2006-01-02T15:04:05-07:00" }},
    "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05-07:00" }},
    "inLanguage": "cs",
    "image": {{ "images/og-image.png" | absURL }},
    "author": { "@type": "Organization", "name": {{ site.Title }}, "url": {{ site.Home.Permalink }} },
    "publisher": { "@type": "Organization", "@id": {{ $orgID }}, "name": {{ site.Title }}, "url": {{ site.Home.Permalink }} }
}
</script>
{{- end }}
{{- end }}
