<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    {{- $description := .Description | default .Site.Params.description }}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ $description }}">
    <meta name="author" content="{{ .Site.Params.author }}">
    <meta name="robots" content="index, follow">
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ .Permalink }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:title" content="{{ .Title | default .Site.Title }}">
    <meta property="og:description" content="{{ $description }}">
    <meta property="og:image" content="{{ .Site.BaseURL }}images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="cs_CZ">
    <meta property="og:site_name" content="VisionOps">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ .Permalink }}">
    <meta name="twitter:title" content="{{ .Title | default .Site.Title }}">
    <meta name="twitter:description" content="{{ $description }}">
    <meta name="twitter:image" content="{{ .Site.BaseURL }}images/og-image.png">
    <meta name="twitter:image:alt" content="VisionOps - Kubernetes a OpenShift specialisté">

    <!-- LLM content discovery -->
    <link rel="llms-txt" href="/llms.txt" type="text/plain">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "VisionOps",
        "alternateName": "{{ .Site.Title }}",
        "description": "{{ .Site.Params.description }}",
        "url": "{{ .Site.BaseURL }}",
        "logo": "{{ .Site.BaseURL }}images/og-image.png",
        "image": "{{ .Site.BaseURL }}images/og-image.png",
        "email": "{{ .Site.Params.email }}",
        "areaServed": {
            "@type": "Country",
            "name": "Czech Republic"
        },
        "serviceType": ["Kubernetes Consulting", "OpenShift Consulting", "DevOps", "CI/CD", "Cloud Migration", "Infrastructure Monitoring"],
        "knowsAbout": ["Kubernetes", "OpenShift", "ArgoCD", "Prometheus", "Grafana", "Terraform", "Ansible", "Jenkins", "GitLab CI"],
        "priceRange": "$$",
        "contactPoint": {
            "@type": "ContactPoint",
            "email": "{{ .Site.Params.email }}",
            "contactType": "sales",
            "availableLanguage": ["Czech", "English"]
        },
        "sameAs": []
    }
    </script>

    {{- if .IsHome }}
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
            {{- range $i, $f := site.Data.faq }}{{ if $i }},{{ end }}
            {
                "@type": "Question",
                "name": {{ $f.question | jsonify }},
                "acceptedAnswer": { "@type": "Answer", "text": {{ $f.answer | jsonify }} }
            }
            {{- end }}
        ]
    }
    </script>
    {{- else if and .IsPage (eq .Section "blog") }}
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": {{ .Title | jsonify }},
        "description": {{ $description | jsonify }},
        "url": {{ .Permalink | jsonify }},
        "datePublished": {{ .Date.Format "2006-01-02" | jsonify }},
        "dateModified": {{ .Lastmod.Format "2006-01-02" | jsonify }},
        "inLanguage": "cs",
        "image": "{{ .Site.BaseURL }}images/og-image.png",
        "author": { "@type": "Organization", "name": "VisionOps", "url": "{{ .Site.BaseURL }}" },
        "publisher": { "@type": "Organization", "name": "VisionOps", "url": "{{ .Site.BaseURL }}" }
    }
    </script>
    {{- end }}
</head>
<body>
    {{ partial "header.html" . }}

    {{ block "main" . }}{{ end }}

    {{ partial "footer.html" . }}
</body>
</html>
