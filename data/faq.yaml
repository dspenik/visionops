- question: "Co jsou Kubernetes konzultace a komu jsou určené?"
  answer: "Kubernetes konzultace zahrnují návrh, implementaci a správu produkčních Kubernetes clusterů. Jsou určené firmám, které chtějí kontejnerizovat své aplikace, zvýšit dostupnost infrastruktury nebo migrovat z tradičních VM na moderní kontejnerové platformy. VisionOps poskytuje konzultace pro on-prem i cloudová prostředí (AKS, OpenShift)."
- question: "Jak probíhá migrace z VMware do Kubernetes?"
  answer: "Migrace začíná důkladnou analýzou současného stavu infrastruktury a aplikací. Následuje návrh cílové architektury, kontejnerizace aplikací a postupný přesun workloadů s minimálním downtime. Podporujeme cesty VMware na Proxmox, VMware na bare-metal Kubernetes i migraci mezi on-prem a cloudem."
- question: "Jaké CI/CD nástroje VisionOps implementuje?"
  answer: "Implementujeme ArgoCD, Tekton, Jenkins, GitLab CI a GitHub Actions. Stavíme plně automatizované CI/CD pipelines od commitu po produkci včetně GitOps workflow, canary deploymentů a automatizovaných rollbacků. Vše s důrazem na Infrastructure as Code a DevOps best practices."
- question: "Jaký monitoring stack VisionOps nasazuje?"
  answer: "Nasazujeme kompletní observability stack: Prometheus a Grafana pro metriky a dashboardy, Grafana Loki pro centralizované logování, OpenTelemetry s Grafana Tempo nebo Jaeger pro distribuované trasování, Grafana Beyla pro eBPF auto-instrumentaci bez změny kódu a Zabbix pro monitoring infrastruktury. Součástí je proaktivní alerting a incident response."
- question: "Poskytuje VisionOps podporu i po nasazení?"
  answer: "Ano. Náš proces zahrnuje 5 kroků: analýza, návrh řešení, implementace, knowledge transfer (školení a dokumentace pro váš tým) a následná podpora. Konzultace jsou dostupné i po go-live, aby byl zajištěn hladký provoz."
- question: "Pracuje VisionOps s on-prem i cloudovými prostředími?"
  answer: "Ano, VisionOps je flexibilní a pracuje s on-premises, cloudovými i hybridními prostředími. Podporujeme Kubernetes, OpenShift a Azure Kubernetes Service (AKS). Řešení navrhujeme na míru podle vaší stávající infrastruktury a požadavků."
