name: Build, check and deploy Hugo site

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/public
            --remap 'https://visionops.cz/(.*) file://${{ github.workspace }}/public/$1'
            --index-files index.html
            --no-progress
            'public/**/*.html'

      - name: Lighthouse SEO audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      - name: Add IndexNow key file
        if: github.event_name != 'pull_request'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: printf '%s' "$INDEXNOW_KEY" > "public/${INDEXNOW_KEY}.txt"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Submit changed URLs to IndexNow
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: https://visionops.cz/sitemap.xml
          key: ${{ secrets.INDEXNOW_KEY }}
          endpoint: api.indexnow.org
          since: 1
          since-unit: day
          failure-strategy: error
