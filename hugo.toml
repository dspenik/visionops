baseURL = 'https://visionops.cz/'
locale = 'cs-CZ'
defaultContentLanguage = 'cs'
title = 'VisionOps'
theme = 'visionops'
enableGitInfo = true

[params]
  description = "Kubernetes konzultace a OpenShift implementace v České republice. DevOps služby pro firmy - CI/CD automatizace, migrace do cloudu, monitoring infrastruktury."
  author = "VisionOps"
  email = "info@visionops.cz"
  images = ["images/og-image.png"]
  sameAs = []

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[taxonomies]

[markup]
  [markup.highlight]
    style = 'modus-vivendi'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = 'keywords'
    weight = 1
